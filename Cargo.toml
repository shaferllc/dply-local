[workspace]
resolver = "2"
members = [
    "crates/dpl-core",
    "crates/dpl-dply",
    "crates/dpl",
    "crates/dpld",
    "crates/dpl-helper",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
authors = ["Tom Shafer"]
license = "MIT"
repository = "https://github.com/tshafer/dply-local"

[workspace.dependencies]
# Shared crates
dpl-core = { path = "crates/dpl-core" }
dpl-dply = { path = "crates/dpl-dply" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP (dply client) — blocking, rustls only (no OpenSSL)
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "stream",
] }

# Async runtime (daemon)
tokio = { version = "1", features = ["full"] }

# Errors, logging, misc
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
nix = { version = "0.29", features = ["fs", "user"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
strip = true
lto = "thin"
