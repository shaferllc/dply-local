[workspace]
resolver = "2"
members = [
    "crates/dpl-core",
    "crates/dpl-dply",
    "crates/dpl-keel",
    "crates/dpl",
    "crates/dpld",
    "crates/dpl-helper",
]

[workspace.package]
version = "0.5.2"
edition = "2021"
rust-version = "1.82"
authors = ["Tom Shafer"]
# Matches LICENSE, which is proprietary. This said `MIT` until 0.5.0 — an
# affirmative grant of the rights LICENSE withholds, left behind when the
# relicense updated every other file. `LicenseRef-` is SPDX's form for a
# licence that isn't in its registry; the crates inherit this key, so it stays
# `license` rather than `license-file`.
license = "LicenseRef-Proprietary"
repository = "https://github.com/shaferllc/dply-local"

[workspace.dependencies]
# Shared crates
dpl-core = { path = "crates/dpl-core" }
dpl-dply = { path = "crates/dpl-dply" }
dpl-keel = { path = "crates/dpl-keel" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP (dply client) — blocking, rustls only (no OpenSSL)
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "stream",
] }

# Async runtime (daemon)
tokio = { version = "1", features = ["full"] }

# Errors, logging, misc
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
nix = { version = "0.29", features = ["fs", "user"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
strip = true
lto = "thin"
